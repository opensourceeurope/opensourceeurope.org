  - type: steps
    variant: spotlight
    background:
      src: ../../assets/theme/webp/bg-how-to.webp
      alt: ""
      decorative: true
    eyebrow: // How to join us
    heading:
      text: Getting started with OSE is quick and simple
      highlight: quick
      decor: parens
    items:
      - title: Create your collective
        body: Create your collective on Open Collective with a ready legal and financial framework
        image:
          src: ../../assets/uploads/2025/11/Create-your-collective-_-open-source-europe.png
          alt: ""
          decorative: true
      - title: Start receiving funds
        body: Start receiving donations and grants from people, companies, or foundations.
        image:
          src: ../../assets/uploads/2025/11/Start-receiving-funds-_-open-source-europe-1.png
          alt: ""
          decorative: true
      - title: Manage your funds
        body: Manage expenses openly on our platform, with full compliance and trust
        image:
          src: ../../assets/uploads/2025/11/Manage-your-funds-_-open-source-europe-1.png
          alt: ""
          decorative: true

  - type: features
    variant: list
    eyebrow: // Key benefits
    heading:
      text: What makes this possible
      highlight: makes
      decor: chevron-underscore
      decorAfter: makes
    items:
      - title: "Radical transparency : every budget is ==public=="
      - title: Simple admin processes
      - title: A nonprofit structure compliant with ==EU law==
      - title: Eligibility for both ==European and US==-based funding.
    image:
      src: ../../assets/uploads/2025/11/Key-benefits-Open-Source.svg
      alt: ""
      decorative: true

  - type: cards
    variant: carousel
    eyebrow: // Supported project
    heading:
      text: Trusted by hundreds of open source projects across Europe
      highlight: source
      decor: chevron-underscore
    body: Hundreds of projects already trust OSE to manage their finances transparently. We support everything from small, single-maintainer libraries to large collaborative ecosystems — always without bureaucracy.
    cta:
      label: explore all on open collective
      href: https://opencollective.com/
    items:
      - title: FM
        body: "\"For open source projects, finances can be traumatic. Open Source Europe removes that pain, making expenses, fundraising, and transparency as easy as it could possibly be.\" - Dee, Fedi Monster"
        image:
          src: ../../assets/uploads/2025/11/8920e7c20bb2ed3354756238ed9b05ee7cca6c5b-min.jpg
          alt: ""
          decorative: true
        logo:
          src: ../../assets/uploads/2025/11/Frame-1707483558.png
          alt: GitHub
        cta:
          label: view project
          href: https://opencollective.com/
          variant: text
      - title: Semantic MediaWiki
        body: "\"For open source projects, finances can be traumatic. Open Source Europe removes that pain, making expenses, fundraising, and transparency as easy as it could possibly be.\" - Dee, Fedi Monster"
        image:
          src: ../../assets/uploads/2025/11/0ae91a10990473bf86578eedaef23bf92f2cea09-min-scaled.jpg
          alt: ""
          decorative: true
        logo:
          src: ../../assets/uploads/2025/11/Frame-1707483559.png
          alt: NLnet Foundation
        cta:
          label: view project
          href: https://opencollective.com/
          variant: text
      - title: Project EdgeTX
        body: ASince 2021, the RC model transmitter firmware project EdgeTX, has chosen OpenCollective to manage its funds. We appreciate the openness of public financial records and the ease of management that Open Collective offers to our open-source project.
        image:
          src: ../../assets/uploads/2025/11/8920e7c20bb2ed3354756238ed9b05ee7cca6c5b-min.jpg
          alt: ""
          decorative: true
