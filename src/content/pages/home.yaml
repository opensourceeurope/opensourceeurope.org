seo:
  title: Open Source Europe | A simple fiscal home for open source projects
  description: Open Source Europe (OSE) is a European nonprofit that offers open source projects a simple fiscal home. Receive donations, manage expenses, and grow without creating a legal entity.

sections:
  - type: hero
    heading:
      text: We take care of the admin. You take care of the code
    body: "Open Source Europe (OSE) is a European nonprofit that offers open source projects a simple fiscal home : receive donations, manage expenses, and grow — without the burden of creating a legal entity."
    ctas:
      - label: submit a project
        href: https://opencollective.com/europe/apply
      - label: for funders
        href: "#for-funders"
        variant: secondary
    background:
      src: ../../assets/theme/webp/bg-hero.webp
      alt: ""
      decorative: true

  - type: intro
    variant: mission
    eyebrow: // Our mission
    heading:
      text: We make open source sustainable without paperwork
      highlight: sustainable
      decor: chevron-underscore
    body:
      - "Our mission is simple: provide **open source projects** with the legal and **financial framework** they need to operate like an **organization** — without becoming one. At **OSE**, we keep admin **invisible and impact visible**, so **contributors** focus on their tools, not their tax status."
    image:
      src: ../../assets/uploads/2026/01/Gemini_Generated_Image_1z56s01z56s01z56-1.png
      alt: ""
      decorative: true

  - type: quote
    quote:
      text: The digital infrastructure that powers government services demands the same investment commitment as the roads and bridges that connect our communities.
      highlight: [government, communities.]
    author: Dries Buytaert
    role: Founder of Drupal
    avatar:
      src: ../../assets/uploads/2026/02/1516256287984.jpeg
      alt: ""
      decorative: true
    # Four rows of nine round holders below the quote (E2).
    circles:
      - - empty
        - ring
        - { logo: { src: ../../assets/uploads/2025/11/mastodon-2.svg, alt: "", decorative: true } }
        - empty
        - empty
