    id: faq
    eyebrow: // faq
    heading:
      text: Frequently asked questions
      highlight: asked
      decor: chevron-underscore
    items:
      - question: Do you host code?
        answer: No, only finances and legal structure.
      - question: Are resources included in the service fee?
        answer: Yes, everything is included.
      - question: Can we get individual advice?
        answer: Yes, guidance is available when needed.
      - question: What kind of events do you organize?
        answer: Community meetups, FOSDEM panels, and online sessions.

