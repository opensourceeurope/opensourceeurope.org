consent:
  title: Privacy settings
  body: This site sets no cookies and loads nothing from other sites. It keeps your choice in your browser's local storage. If you accept analytics, the questions you ask the chat are shared with OSE. You can change your choice at any time with the Privacy settings link at the bottom of each page.
  privacy_link:
    label: Privacy policy
    href: /privacy-policy/
  accept: Accept analytics
  reject: Reject analytics
  settings: Manage my preferences
  save: Save my choice
  close_label: Close
  always_on: Always on
  necessary:
    name: Necessary
    description: Remembers your choice on this banner in your browser's local storage. The site sets no cookies.
  analytics:
    name: Analytics
    description: If you accept, the questions you ask the chat are shared with OSE to improve the docs. OSE gets the question text, the number of calls to the AI model, whether the docs answered it, a version label of the assistant's instructions and the time. Nothing else is measured in your browser. If you reject, nothing is shared.

apply_url: https://opencollective.com/europe/apply
