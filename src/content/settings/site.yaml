chat:
  title: Ask Open Source Europe
  intro: A public assistant that searches the official OSE documentation and answers with sources you can verify. Fiscal hosting, onboarding, policies, processes. Ask in your own words.
  placeholder: Ask about OSE…
  input_label: Your question
  send_label: Send question
  suggestions_label: Try
  suggestions:
    - What is Open Source Europe?
    - How does fiscal hosting work at OSE?
    - How do I submit an expense and get paid?
  sharing_on: Your questions are shared to help OSE improve the docs.
  sharing_off: Your questions are not shared.
  sharing_settings: Change this in Privacy settings
  small_model_note_short: A public demo running a small model. Answers can be incomplete, so check the sources.
  memory_note: The conversation ends when you open another page.
  sources_label: Sources
  you_label: You
  assistant_label: OSE
  loading: Searching the OSE docs…
  loading_long: Still working…
  status_searching_start: Searching the OSE docs…
  status_searching: 'Searching the docs: {query}…'
  status_writing: Writing the answer…
  status_ready: Answer ready
  stop_label: Stop the answer
  stopped_note: Stopped. The answer is incomplete.
  followups_label: Ask next
  error: Sorry, I couldn't reach the OSE assistant just now. Please check your connection and try again in a moment.
  error_busy: The assistant is busy. Try again in a minute.
  error_unavailable: The assistant is not available right now. Try again later.
  error_timeout: The answer took too long. Try again in a moment.
  no_js: The chat needs JavaScript. Turn it on in your browser to ask a question.
  open_label: Ask
  close_label: Close the chat
  how_it_works:
    label: How this works
    href: /ask/
  shortcut_mac: ⌘K
  shortcut_other: Ctrl K

