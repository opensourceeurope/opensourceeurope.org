# Settings of the documentation at /docs/. astro.config.mjs reads this file
# through src/lib/docs-settings.mjs. The header is the site header, from site.yaml.
# The page title suffix, as in "Basics | OSE docs".
title: OSE docs
# The button that opens the docs sidebar on small screens, beside the site menu button.
menu_label: Contents
# "Edit page" at the bottom of every docs page and blog post. It opens a short
# note on the two ways to change the page.
edit:
  label: Edit page
  manual_label: Edit this page on GitHub
  manual_text: Change the text in your browser and propose it as a pull request.
  ai_text: 'Or work with an AI assistant: clone the repository and open it in Claude Code. The repository''s instructions and its docs-authoring skill guide the change, the checks and the pull request, and its humanize skill makes the new text read like a person wrote it.'
  clone_command: git clone https://github.com/opensourceeurope/opensourceeurope.org.git
  more_label: More about contributing
  more_href: https://github.com/opensourceeurope/opensourceeurope.org#contribute-to-the-site
# The sidebar, in reading order. The groups follow the task-based contents of the
# consolidated OSE documentation.
# An entry is one of:
#   - page: docs/<path>             a page; the sidebar shows its title
#   - label: ... / link: /docs/...  a link with its own label
#   - label: ... / items: [...]     a group of entries
# Every page under docs/ must appear here once. A unit test checks it.
# The sidebar does not show the docs home (page: docs): the "Docs" link in the
# site header leads there.
sidebar:
  - page: docs
  - label: Join OSE
    items:
      - page: docs/getting-started/how-to-apply
      - page: docs/getting-started/how-to-apply/eligibility
      - page: docs/getting-started/how-to-apply/application-questions
  - label: Run your Collective
    items:
      - page: docs/how-it-works/basics
      - page: docs/guides/deciding-on-how-to-use-your-money
      - page: docs/faq/fiscal-hosting-faqs
  - label: Receive funds
    items:
      - page: docs/how-it-works/financial-contributions-how-to-donate
      - page: docs/how-it-works/financial-contributions-how-to-donate/wire-transfer-instructions-via-open-collective-platform
      - page: docs/how-it-works/financial-contributions-how-to-donate/applying-for-grants
      - page: docs/how-it-works/financial-contributions-how-to-donate/fundraising-tools-and-resources
      - page: docs/how-it-works/financial-contributions-how-to-donate/setting-up-github-sponsors
      - page: docs/what-we-offer/tax-deductible-giving-for-us-donors
      - page: docs/what-we-offer/equivalency-determination-certificate
      - page: docs/how-it-works/financial-contributions-how-to-donate/contributions-in-cryptocurrencies
      - page: docs/how-it-works/financial-contributions-how-to-donate/refunds
      - page: docs/faq/contributions-faq
  - label: Pay and get reimbursed
    items:
      - page: docs/how-it-works/expenses
      - page: docs/how-it-works/expenses/invoices-or-reimbursements
      - page: docs/how-it-works/expenses/expenses-and-getting-paid-faqs
      - page: docs/faq/expense-faqs
      - page: docs/how-it-works/expenses/request-a-grant-for-nonprofits-only
      - page: docs/how-it-works/expenses/the-partnership
      - page: docs/how-it-works/expenses/the-partnership/vat-in-europe-and-how-it-works-in-ose
  - label: Fees and hosting rules
    items:
      - page: docs/faq/general-faqs
      - page: docs/terms-of-service
  - label: Get help and understand OSE
    items:
      - page: docs/about/contact-us
      - page: docs/guides/ask-ose-from-your-ai-tools
      - page: docs/about/safeguarding-policy
      - page: docs/about/community-guidelines
      - page: docs/about/terminology
      - page: docs/about-open-source-europe
      - page: docs/what-we-offer
      - page: docs/what-we-offer/umbrella-organisation
      - page: docs/what-we-offer/the-open-collective-platform
      - page: docs/about/mission-vision-and-impact-areas
      - page: docs/about/risk-and-compliance-aspects
