# Audits the production dependencies of the site and of the chat function.
# Workflow files are audited by lint-workflows.yml (zizmor).
name: Security audit

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # Runs npm audit for the site and functions/chat, and fails on a high or
      # critical advisory that audit-exceptions.json does not cover. npm audit
      # reads package-lock.json, so no install is needed.
      - name: Audit the site and chat function dependencies
        run: node scripts/check-audit.mjs
