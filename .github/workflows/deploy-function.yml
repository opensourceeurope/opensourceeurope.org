# Builds the contact function and deploys the zip to Scaleway Serverless Functions.
# Setup, variables and secrets are listed in docs/deployment.md.
name: deploy function

on:
  workflow_call:         # invoked by the release pipeline (release.yml)
    secrets:
      SCW_ACCESS_KEY: { required: true }
      SCW_SECRET_KEY: { required: true }
      SCW_DEFAULT_PROJECT_ID: { required: true }
      SCW_DEFAULT_ORGANIZATION_ID: { required: true }
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-function
  cancel-in-progress: false

env:
  SCW_CLI_VERSION: 2.65.2
  # From the SHA256SUMS file of the v2.65.2 release, entry scaleway-cli_2.65.2_linux_amd64.
  SCW_CLI_SHA256: 184e697e6ab8a8e825be1c5cf61d104341abe3598bb0e20b7a54618cb05231b3

jobs:
  deploy:
    # A manual run from another branch must not reach production.
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Check the deploy settings
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          SCW_REGION: ${{ vars.SCW_REGION }}
          SCW_FUNCTION_ID: ${{ vars.SCW_FUNCTION_ID }}
        run: |
          missing=0
          for name in SCW_ACCESS_KEY SCW_SECRET_KEY SCW_DEFAULT_PROJECT_ID SCW_DEFAULT_ORGANIZATION_ID SCW_REGION SCW_FUNCTION_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set. See docs/deployment.md."
              missing=1
            fi
          done
          exit "$missing"

      - run: npm ci

      - run: npm run build:function

      - name: Install the Scaleway CLI
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scw"
          cd "$RUNNER_TEMP/scw"
          curl -fsSLo scw "https://github.com/scaleway/scaleway-cli/releases/download/v${SCW_CLI_VERSION}/scaleway-cli_${SCW_CLI_VERSION}_linux_amd64"
          echo "${SCW_CLI_SHA256}  scw" | sha256sum --check
          chmod +x scw
          echo "$RUNNER_TEMP/scw" >> "$GITHUB_PATH"

      - name: Deploy the function
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          # scw function deploy fails with "organization ID is required" without these.
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          SCW_DEFAULT_REGION: ${{ vars.SCW_REGION }}
          SCW_FUNCTION_ID: ${{ vars.SCW_FUNCTION_ID }}
        run: |
          set -euo pipefail
          # "scw function deploy" wants the namespace and the function name.
          # Read both from the function, so one variable is enough.
          fn=$(scw function function get "$SCW_FUNCTION_ID" -o json)
          namespace_id=$(jq -r '.namespace_id' <<<"$fn")
          name=$(jq -r '.name' <<<"$fn")
          # No environment-variables or secret-environment-variables here.
          # The deploy only changes the code and the runtime, so the values
          # set in the console stay as they are.
          scw function deploy \
            namespace-id="$namespace_id" \
            name="$name" \
            runtime=node22 \
            zip-file=functions/contact/contact.zip
