# Two jobs that run side by side. ci: type check, unit tests, the contact
# function bundle, the licence check and the co-author check. e2e: Playwright
# with the accessibility scan. Its web server builds the site, so the build is
# not a separate step.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npm test

      - run: npm run build:function

      - run: npm ci --prefix functions/chat

      - run: npm run licences

      - name: Check commits for agent co-authors
        env:
          # A new branch has an all-zero "before"; fall back to main then.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git merge-base origin/main "$HEAD" 2>/dev/null || true)
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "$HEAD" ]; then
            echo "::notice::No base commit to compare against; skipping the co-author check."
            exit 0
          fi
          bash scripts/check-coauthors.sh "$BASE" "$HEAD"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e
