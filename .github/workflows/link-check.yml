# Checks links in the built site and in the Markdown docs. Runs weekly as well,
# because external links rot without a commit to show for it.
name: link check

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # Restores the optimized images Astro writes to node_modules/.astro/assets,
      # so the build does not spend two minutes generating them again. It comes
      # after npm ci, which deletes node_modules.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.astro/assets
          key: astro-assets-${{ runner.os }}-${{ hashFiles('src/assets/**', 'public/app/uploads/**', 'package-lock.json') }}
          restore-keys: astro-assets-${{ runner.os }}-

      - name: Build the site
        env:
          PUBLIC_CONTACT_ENDPOINT: http://localhost:8081
          PUBLIC_CHAT_ENDPOINT: http://localhost:8080
        run: npm run build

      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          fail: true
          args: >-
            --config lychee.toml
            --root-dir dist
            --no-progress
            'dist/**/*.html'
            README.md
            DEVELOPMENT.md
            AGENTS.md
            'docs/**/*.md'
