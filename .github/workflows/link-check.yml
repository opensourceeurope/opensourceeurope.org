# Checks links in the built site and in the Markdown docs. Runs weekly as well,
# because external links rot without a commit to show for it.
name: link check

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the site
        env:
          PUBLIC_CONTACT_ENDPOINT: http://localhost:8081
          PUBLIC_CHAT_ENDPOINT: http://localhost:8080
        run: npm run build

      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          fail: true
          args: >-
            --config lychee.toml
            --root-dir dist
            --no-progress
            'dist/**/*.html'
            README.md
            AGENTS.md
            'docs/**/*.md'
