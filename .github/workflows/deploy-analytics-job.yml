name: Deploy analytics export job to Scaleway

# Builds the analytics/ image, pushes it to the Scaleway registry and deploys the
# analytics export job. The job runs on Scaleway in the EU region, on a cron. It reads
# the chat analytics that visitors shared with consent from Cockpit and writes them to
# a private bucket. It then counts page views per page from the Edge Services logs in
# Cockpit and writes only these totals to the same bucket. The image holds only the
# scripts, so building it on GitHub runners in the US moves no analytics data out of
# the EU.
#
# The job reads these secrets from Scaleway Secret Manager at run time:
#   SCW_SECRET_KEY      from ose-analytics-export-scw-secret-key
#   COCKPIT_TOKEN       from ose-analytics-export-cockpit-token
#   EDGE_COCKPIT_TOKEN  from ose-analytics-export-edge-cockpit-token, only when the
#                       repository variable OSE_EDGE_LOKI_URL is set
# Their values never enter GitHub. SCW_ACCESS_KEY on the job is the access key of the
# IAM application ose-analytics-export, which can only write and delete objects in the
# project.
# The CI deploy key never goes into the job.
#
# The first run creates the job definition: image, cron, CPU limit, the plain env vars
# and the two secret references. Later runs change only the image and the CPU limit,
# so they keep the env vars and the secret references on the job.
#
# Create the IAM application, its key, the Cockpit token and the two secrets once,
# before the first run. analytics/README.md lists the commands.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - analytics/**
      - .github/workflows/deploy-analytics-job.yml

permissions:
  contents: read

env:
  SCW_CLI_VERSION: 2.65.2
  # From the SHA256SUMS file of the v2.65.2 release, entry scaleway-cli_2.65.2_linux_amd64.
  SCW_CLI_SHA256: 184e697e6ab8a8e825be1c5cf61d104341abe3598bb0e20b7a54618cb05231b3

concurrency:
  group: deploy-analytics-job
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
      SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
      SCW_DEFAULT_REGION: ${{ vars.SCW_REGION }}
      REGISTRY: rg.${{ vars.SCW_REGION }}.scw.cloud/${{ vars.SCW_REGISTRY_NAMESPACE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Scaleway CLI
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scw"
          cd "$RUNNER_TEMP/scw"
          curl -fsSLo scw "https://github.com/scaleway/scaleway-cli/releases/download/v${SCW_CLI_VERSION}/scaleway-cli_${SCW_CLI_VERSION}_linux_amd64"
          echo "${SCW_CLI_SHA256}  scw" | sha256sum --check
          chmod +x scw
          echo "$RUNNER_TEMP/scw" >> "$GITHUB_PATH"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Scaleway Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: rg.${{ vars.SCW_REGION }}.scw.cloud
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: analytics
          file: analytics/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/ose-analytics-job:latest
            ${{ env.REGISTRY }}/ose-analytics-job:${{ github.sha }}

      - name: Create or update the analytics job definition
        env:
          IMAGE: ${{ env.REGISTRY }}/ose-analytics-job:${{ github.sha }}
          REGION: ${{ vars.SCW_REGION }}
          LOKI_URL: ${{ vars.OSE_ANALYTICS_LOKI_URL }}
          ANALYTICS_BUCKET: ${{ vars.ANALYTICS_BUCKET }}
          # Loki URL of the Cockpit logs data source that holds the Edge Services logs.
          # Empty means the job skips the page-view counts.
          EDGE_LOKI_URL: ${{ vars.OSE_EDGE_LOKI_URL }}
          # Access key ID of the ose-analytics-export IAM application. An access key ID
          # is not a secret: the matching secret key stays in Secret Manager.
          JOB_ACCESS_KEY: ${{ vars.ANALYTICS_EXPORT_ACCESS_KEY }}
        run: |
          set -euo pipefail
          NAME=ose-analytics-export
          SECRET_KEY_SECRET=ose-analytics-export-scw-secret-key
          COCKPIT_TOKEN_SECRET=ose-analytics-export-cockpit-token
          EDGE_TOKEN_SECRET=ose-analytics-export-edge-cockpit-token

          # Keep this at 500 mCPU or more. At 70 mCPU, TLS handshakes and the Python aws CLI
          # are so slow that a run passes the 300 s job timeout before its uploads finish.
          CPU_LIMIT=500

          ID="$(scw jobs definition list region="$REGION" -o json \
            | jq -r --arg n "$NAME" '.[] | select(.name==$n) | .id' | head -n1)"

          if [ -n "$ID" ]; then
            # Do not pass environment-variables here. An update that sets them replaces
            # the whole set on the job.
            echo "Rolling image forward on existing job definition $ID"
            scw jobs definition update "$ID" region="$REGION" image-uri="$IMAGE" cpu-limit="$CPU_LIMIT"
            exit 0
          fi

          [ -n "$LOKI_URL" ] || { echo "::error::repo variable OSE_ANALYTICS_LOKI_URL is not set"; exit 1; }
          [ -n "$ANALYTICS_BUCKET" ] || { echo "::error::repo variable ANALYTICS_BUCKET is not set"; exit 1; }
          [ -n "$JOB_ACCESS_KEY" ] || { echo "::error::repo variable ANALYTICS_EXPORT_ACCESS_KEY is not set. Set it to the access key ID of the ose-analytics-export IAM application (see analytics/README.md)."; exit 1; }

          # Look up both secrets before creating anything, so a missing secret leaves no
          # half-configured job behind.
          secret_id() {
            scw secret secret list region="$REGION" project-id="$SCW_DEFAULT_PROJECT_ID" name="$1" -o json \
              | jq -r --arg n "$1" '[.[] | select(.name==$n)][0].id // empty'
          }
          SECRET_KEY_ID="$(secret_id "$SECRET_KEY_SECRET")"
          COCKPIT_TOKEN_ID="$(secret_id "$COCKPIT_TOKEN_SECRET")"
          missing=""
          [ -n "$SECRET_KEY_ID" ] || missing="$missing $SECRET_KEY_SECRET"
          [ -n "$COCKPIT_TOKEN_ID" ] || missing="$missing $COCKPIT_TOKEN_SECRET"
          EDGE_TOKEN_ID=""
          if [ -n "$EDGE_LOKI_URL" ]; then
            EDGE_TOKEN_ID="$(secret_id "$EDGE_TOKEN_SECRET")"
            [ -n "$EDGE_TOKEN_ID" ] || missing="$missing $EDGE_TOKEN_SECRET"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Secret Manager in $REGION has no secret named:$missing. Create it as described in analytics/README.md, then run this workflow again."
            exit 1
          fi

          edge_env=()
          edge_secret=()
          if [ -n "$EDGE_LOKI_URL" ]; then
            edge_env=(environment-variables.EDGE_LOKI_URL="$EDGE_LOKI_URL")
            edge_secret=(secrets.2.secret-manager-id="$EDGE_TOKEN_ID" secrets.2.secret-manager-version=latest secrets.2.env-var-name=EDGE_COCKPIT_TOKEN)
          fi

          echo "Creating job definition $NAME"
          ID="$(scw jobs definition create region="$REGION" -o json \
            name="$NAME" cpu-limit="$CPU_LIMIT" memory-limit=128 local-storage-capacity=1000 job-timeout=300s \
            image-uri="$IMAGE" \
            cron-schedule.schedule="0 4 */3 * *" cron-schedule.timezone="Europe/Warsaw" \
            environment-variables.LOKI_URL="$LOKI_URL" \
            environment-variables.ANALYTICS_BUCKET="$ANALYTICS_BUCKET" \
            environment-variables.SCW_REGION="$REGION" \
            environment-variables.SCW_ACCESS_KEY="$JOB_ACCESS_KEY" \
            "${edge_env[@]}" \
            | jq -r '.id')"

          echo "Attaching the Secret Manager references to job definition $ID"
          if ! scw jobs secret create job-definition-id="$ID" region="$REGION" \
            secrets.0.secret-manager-id="$SECRET_KEY_ID" secrets.0.secret-manager-version=latest secrets.0.env-var-name=SCW_SECRET_KEY \
            secrets.1.secret-manager-id="$COCKPIT_TOKEN_ID" secrets.1.secret-manager-version=latest secrets.1.env-var-name=COCKPIT_TOKEN \
            "${edge_secret[@]}"; then
            echo "::error::Job definition $ID exists but has no secret references. Later runs only update the image, so attach them by hand with the scw jobs secret create command in analytics/README.md."
            exit 1
          fi
          echo "::notice::Job definition $NAME created with its secret references. Start a run in the Scaleway console to check it."
