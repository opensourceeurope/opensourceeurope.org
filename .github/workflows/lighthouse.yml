# Lighthouse budgets on every enabled route, desktop and mobile. The budgets are
# in lighthouserc.desktop.json and lighthouserc.mobile.json. @lhci/cli is the
# version pinned in package-lock.json.
name: lighthouse

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Mobile and desktop run on separate runners. Two audits on one runner share its
  # CPU, and that lowers the performance scores the budgets check.
  audit:
    name: lighthouse (${{ matrix.form }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        form: [mobile, desktop]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Build the site
        env:
          PUBLIC_CONTACT_ENDPOINT: http://localhost:8081
          PUBLIC_CHAT_ENDPOINT: http://localhost:8080
        run: npm run build

      - name: Lighthouse, ${{ matrix.form }}
        run: npx lhci autorun --config=lighthouserc.${{ matrix.form }}.json

  # Branch protection on main requires a check named lighthouse. The matrix jobs
  # report as lighthouse (mobile) and lighthouse (desktop), so this job carries
  # the required name and fails unless both audits succeeded.
  lighthouse:
    needs: audit
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both audits to pass
        env:
          RESULT: ${{ needs.audit.result }}
        run: |
          echo "Lighthouse audits: $RESULT"
          [ "$RESULT" = success ]
